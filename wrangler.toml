# Cloudflare Pages (GitHub → kulibert-desk). Grok/Vercel ignore this file.
name = "kulibert-desk"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Rooms share one desk: Cloudflare → this project → Settings → Bindings
# → KV namespace → Add → variable name TW_DESK → create "techworks-desk".
# Until that KV is bound, marks live in the DeskBook durable object below.

[[durable_objects.bindings]]
name = "TW_BOOK"
class_name = "DeskBook"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeskBook"]
