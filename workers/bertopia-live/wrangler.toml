# Bertopia live server, P1 (dark). Not deployed yet.
# Only the TechWorks Pages project reaches this Worker, through a service binding named BT_LIVE
# (added to the Pages project at deploy time, not in this PR). There is no public route.
name = "bertopia-live"
main = "src/index.ts"
compatibility_date = "2026-09-08"
workers_dev = false

[[durable_objects.bindings]]
name = "BERTOPIA_WORLD"
class_name = "BertopiaWorld"

# SQLite-backed Durable Object. P2 keeps chunk revs, the edit layer and 30 days of chat in it.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BertopiaWorld"]

[observability]
enabled = false

# D1 copy of the shared worlds (see migrations/0001_live_chunks.sql). Not bound yet: the database is created and
# bound at deploy time, and without LIVE_DB the object keeps everything in its own storage only.
# [[d1_databases]]
# binding = "LIVE_DB"
# database_name = "bertopia-live"
# database_id = "<set at deploy>"
# migrations_dir = "migrations"
